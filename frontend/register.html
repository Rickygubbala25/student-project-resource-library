<link rel="stylesheet" href="css/responsive.css"></head><body><main class="auth-page"><div class="auth-card wide glass"><a class="brand" href="index.html"><span class="brand-mark">SP</span><span>Student Project<br><small>Resource Library</small></span></a><span class="eyebrow">CREATE ACCOUNT</span><h1>Join the library.</h1><form id="registerForm"><div class="form-grid"><label>Full name<input name="fullName" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><label>College<input name="college"></label><label>Department<input name="department" placeholder="Computer Engineering"></label><label>Year / Semester<input name="semester" placeholder="5th Semester"></label><label>Student ID <small>(optional)</small><input name="studentId"></label></div><button class="btn primary full">Create account</button><div id="message" class="message"></div></form><p class="switch">Already registered? <a href="login.html">Sign in</a></p></div></main><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
